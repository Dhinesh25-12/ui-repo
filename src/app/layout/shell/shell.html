<div class="shell" [class.sidebar-collapsed]="!sidebarOpen()">
    <div
    class="sidebar-backdrop"
    *ngIf="sidebarOpen()"
    (click)="closeSidebar()"
    aria-hidden="true"
  ></div>
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-icon">🛡️</span>
      <span class="brand-text">Insurance Portal</span>
    </div>
    <nav class="nav">
      <a
        *ngFor="let item of visibleNavItems()"
        [routerLink]="item.path"
        routerLinkActive="active"
        class="nav-item"
         (click)="closeSidebarOnMobile()"
      >
        <span class="nav-icon">{{ item.icon }}</span>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    </nav>
    <button class="logout-btn sidebar-logout" (click)="logout()">
      <span class="nav-icon">🚪</span>
      <span>Logout</span>
    </button>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="menu-toggle" (click)="toggleSidebar()" aria-label="Toggle navigation">☰</button>
      <h1 class="page-title">{{ pageTitle() }}</h1>
      <div class="spacer"></div>

      <button class="bell-btn" (click)="toggleNotifications()" aria-label="Notifications">
        🔔
        <span class="bell-badge" *ngIf="unreadCount() > 0">{{ unreadCount() }}</span>
      </button>

      <div class="user-menu" *ngIf="auth.currentUser() as user">
        <button class="user-info" (click)="toggleUserMenu()">
          <span class="avatar">{{ user.fullName?.charAt(0) || '?' }}</span>
          <span class="user-text">
            <span class="user-name">{{ user.fullName }}</span>
            <span class="user-roles">{{ user.roles.join(', ') }}</span>
          </span>
          <span class="caret">▾</span>
        </button>
        <div class="user-dropdown" *ngIf="userMenuOpen()">
         <a routerLink="/profile" (click)="toggleUserMenu(); closeSidebarOnMobile()">My Profile</a>
          <button (click)="logout()">Logout</button>
        </div>
      </div>
    </header>

    <main class="content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
