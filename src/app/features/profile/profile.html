<div class="profile">
  <h1>My Profile</h1>

  <div class="card" *ngIf="auth.currentUser() as user">
    <dl>
      <dt>Full name</dt><dd>{{ user.fullName }}</dd>
      <dt>Username</dt><dd>{{ user.username }}</dd>
      <dt>Email</dt><dd>{{ user.email }}</dd>
      <dt>Roles</dt><dd>{{ user.roles.join(', ') }}</dd>
    </dl>
  </div>
</div>
